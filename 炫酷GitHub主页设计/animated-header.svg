<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="360" viewBox="0 0 1600 360" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="g" x1="0" x2="1">
      <stop offset="0%" stop-color="#071020">
        <animate attributeName="stop-color" values="#071020;#0b2a3a;#081826;#071020" dur="10s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#081826">
        <animate attributeName="stop-color" values="#081826;#071020;#0b2a3a;#081826" dur="10s" repeatCount="indefinite" />
      </stop>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feBlend in="SourceGraphic" in2="blur" mode="normal" />
    </filter>
  </defs>

  <rect width="100%" height="100%" fill="url(#g)" />

  <!-- subtle star field -->
  <g fill="#ffffff" opacity="0.9">
    <circle cx="120" cy="40" r="1.3"><animate attributeName="opacity" values="0.2;1;0.2" dur="3.6s" repeatCount="indefinite" /></circle>
    <circle cx="260" cy="90" r="1.0"><animate attributeName="opacity" values="0.1;0.9;0.1" dur="4.2s" repeatCount="indefinite" /></circle>
    <circle cx="380" cy="60" r="1.6"><animate attributeName="opacity" values="0.2;1;0.2" dur="5s" repeatCount="indefinite" /></circle>
    <circle cx="520" cy="120" r="1.1"><animate attributeName="opacity" values="0.15;0.95;0.15" dur="3.8s" repeatCount="indefinite" /></circle>
    <circle cx="760" cy="40" r="1.4"><animate attributeName="opacity" values="0.25;1;0.25" dur="4.6s" repeatCount="indefinite" /></circle>
    <circle cx="940" cy="80" r="0.9"><animate attributeName="opacity" values="0.1;0.8;0.1" dur="3.2s" repeatCount="indefinite" /></circle>
    <circle cx="1120" cy="110" r="1.2"><animate attributeName="opacity" values="0.12;0.9;0.12" dur="4.8s" repeatCount="indefinite" /></circle>
    <circle cx="1320" cy="50" r="1.0"><animate attributeName="opacity" values="0.08;0.85;0.08" dur="5.2s" repeatCount="indefinite" /></circle>
  </g>

  <!-- drifting subtle nebula shapes -->
  <g fill="#8B1E2D" opacity="0.06">
    <ellipse cx="400" cy="210" rx="520" ry="60">
      <animate attributeName="cx" from="360" to="440" dur="16s" repeatCount="indefinite" />
    </ellipse>
    <ellipse cx="1200" cy="230" rx="420" ry="50">
      <animate attributeName="cx" from="1160" to="1240" dur="18s" repeatCount="indefinite" />
    </ellipse>
  </g>

  <!-- subtle shooting star -->
  <g stroke="#ffffff" stroke-opacity="0.9" stroke-width="1">
    <line x1="1500" y1="30" x2="1560" y2="0" stroke-linecap="round" opacity="0">
      <animate attributeName="opacity" values="0;1;0" dur="2s" begin="1.5s" repeatCount="indefinite" />
      <animate attributeName="x1" from="1700" to="1200" dur="2s" begin="1.5s" repeatCount="indefinite" />
      <animate attributeName="x2" from="1760" to="1260" dur="2s" begin="1.5s" repeatCount="indefinite" />
    </line>
  </g>

  <!-- Title -->
  <g fill="#fff" font-family="Inter, Verdana, Arial, Helvetica, sans-serif" font-weight="700" text-anchor="middle">
    <text x="50%" y="45%" font-size="56">CHERISHYAN</text>
    <text x="50%" y="65%" font-size="20" fill="rgba(255,255,255,0.85)">Nordic calm · Italian clarity · French editorial mood</text>
  </g>

</svg>
